[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rfp-intelligence"
version = "0.1.0"
description = "RFP document search, structured extraction, and multi-agent question answering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic-settings>=2.5,<3",
    "PyMuPDF==1.26.5",
    "beautifulsoup4>=4.13,<5",
    "python-multipart>=0.0.20,<1",
    "rank-bm25==0.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1", "reportlab>=4,<5", "pdfplumber>=0.11,<0.12"]
embeddings = ["sentence-transformers==5.1.2", "transformers>=4.51,<5"]
storage = ["chromadb==1.1.1"]
agents = ["groq==0.37.1", "langgraph==1.2.14"]

[project.scripts]
rfp = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["storage", "outputs", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I"]
